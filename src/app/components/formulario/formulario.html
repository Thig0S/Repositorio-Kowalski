<section class="bg-primary p-3 d-flex flex-column max-height-30">
  <h3 class="text-center my-1 fst-italic display-5 fw-medium">Contact Me!</h3>
  <hr />
  <form class="row">
    <div class="col col-lg-4 form-group mt-3 d-flex flex-column gap-2">
      <label for="Name">Name</label>
      <input type="text" class="form-control" id="Name" />
      <label for="exampleInputEmail1">Email address</label>
      <input
        type="email"
        class="form-control"
        id="exampleInputEmail1"
        aria-describedby="emailHelp"
      />
      <small id="emailHelp" class="form-text text-muted"
        >We'll never share your email with anyone else.</small
      >
    </div>
    <div class="form-group d-flex flex-column gap-2 mt-1">
      <label for="messagem">Message</label>
      <textarea type="text" class="form-control h-100 d-inline-block mb-4" id="messagem"></textarea>
    </div>
    <hr />
    <div class="d-flex justify-content-center">
      <button
        type="submit"
        class="btn btn-light mt-1 d-flex align-items-center w-75 justify-content-center fs-5"
      >
        Send
      </button>
    </div>
  </form>
</section>
