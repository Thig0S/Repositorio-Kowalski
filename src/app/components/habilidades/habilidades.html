<section id="habilidades" class="">
  <div class="container my-5">
    <h2 class="display-5 fw-medium fst-italic text-center">Stack</h2>

    <p class="mt-5 fs-5 text-center">
      Aqui, você podera conhecer as principais tecnologias que utilizo no desenvolvimento de
      aplicações
    </p>

    <ul>
      @for (Habilidade of listaDaHabilidades; track Habilidade.titulo) {
        <li class="col">
          <article class="d-flex align-items-center gap-4 h-100 border-bottom pb-4">
            <img width="64" height="64" [src]="Habilidade.imagem" [alt]="Habilidade.titulo" />

            <h3 class="fs-4 fw-mediu fst-italic">{{ Habilidade.titulo }}</h3>
            <p class="fs-5 mb-0">{{ Habilidade.descricao }}</p>
          </article>
        </li>
      }
    </ul>
  </div>
</section>
